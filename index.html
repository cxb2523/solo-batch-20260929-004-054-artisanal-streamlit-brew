<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Nebula Cafe · 指标量表</title>
  <meta name="description" content="Artisanal Streamlit Brew Metrics — 客流预测与库存健康度量表" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <span class="brand">☕ Nebula Cafe · 运营脉搏</span>
      <span class="brand-sub">artisanal-streamlit-brew-metrics</span>
    </div>
  </header>

  <main class="wrap">
    <section class="intro">
      <h1>预测客流 <span class="accent">&amp;</span> 库存协和</h1>
      <p>纯函数算分档，SVG 负责绘制，事件单独绑定。切换阈值档位可观察同一只量表的分档与动画。</p>
    </section>

    <section class="preset-bar" data-preset-bar aria-label="阈值档位切换">
      <button type="button" class="preset-btn" data-preset-id="gentle">保守档</button>
      <button type="button" class="preset-btn" data-preset-id="standard">标准档</button>
      <button type="button" class="preset-btn" data-preset-id="rush">冲刺档</button>
    </section>

    <section class="dashboard" data-dashboard aria-live="polite"></section>
  </main>

  <div class="tooltip" id="gauge-tooltip" data-tooltip role="tooltip" aria-hidden="true"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
