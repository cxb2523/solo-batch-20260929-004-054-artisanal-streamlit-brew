<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Nebula Cafe · Coffee Sales Dashboard 2026</title>
<meta name="description" content="Interactive Coffee Sales Dashboard 2026 — Streamlit Analytics" />
<link rel="stylesheet" href="css/app.css" />
</head>
<body>
<header class="nav">
  <div class="nav-inner">
    <span class="brand">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/><line x1="6" y1="2" x2="6" y2="4"/><line x1="10" y1="2" x2="10" y2="4"/><line x1="14" y1="2" x2="14" y2="4"/></svg>
      <span class="brand-slash">/</span><span class="brand-name">nebula-cafe</span>
    </span>
    <span class="pill"><span class="dot"></span><strong>FY 2026</strong><span class="sep">·</span> live metrics</span>
  </div>
</header>
<main>
  <div class="container">
    <section class="hero">
      <h1><span class="accent">$</span> Coffee Sales Dashboard</h1>
      <p class="lead">Interactive Coffee Sales Dashboard 2026 — Streamlit Analytics。切换下方档位查看不同周期的指标口径与边界表现。</p>
      <div class="range-bar" role="group" aria-label="数据档位">
        <button type="button" class="range-btn" data-range="daily" aria-pressed="false">今日</button>
        <button type="button" class="range-btn" data-range="weekly" aria-pressed="false">本周</button>
        <button type="button" class="range-btn" data-range="monthly" aria-pressed="false">本月</button>
      </div>
    </section>
    <section class="section" id="dashboard" aria-live="polite"></section>
    <div class="legend" aria-hidden="true">
      <span><i class="dot-tier dot-empty"></i>0% 空档</span>
      <span><i class="dot-tier dot-cold"></i>&lt;60% 冷清</span>
      <span><i class="dot-tier dot-warm"></i>60–85% 平稳</span>
      <span><i class="dot-tier dot-hot"></i>85–100% 高峰</span>
      <span><i class="dot-tier dot-over"></i>&gt;100% 溢出</span>
      <span><i class="dot-tier dot-invalid"></i>NaN 无数据</span>
    </div>
  </div>
</main>
<footer class="footer">
  <div class="container">© 2026 Nebula Cafe — 指标 / 绘制 / 绑定三层分离，边界口径由 node --test 锁定。</div>
</footer>
<script type="module" src="js/main.js"></script>
</body>
</html>
